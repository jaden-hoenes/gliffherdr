[package]
name = "gliffherdr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A herdr plugin that opens gliff remote desktops to any machine you can ssh to"
license = "MIT"
repository = "https://github.com/jaden-hoenes/gliffherdr"
readme = "README.md"
keywords = ["herdr", "gliff", "hyprland", "remote-desktop", "ssh"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "gliffherdr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
anyhow = "1.0.104"
thiserror = "2.0.21"
nucleo-matcher = "0.3.1"
libc = "0.2.191"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
insta = "1.49.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "deny"          # the single setsid pre_exec is #[allow(unsafe_code)] with a SAFETY comment
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
