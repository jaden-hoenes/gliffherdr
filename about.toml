# cargo-about configuration: the licences of the dependencies that end up in the release binary.
# `cargo about generate about.hbs > THIRD_PARTY_LICENSES.html` (release workflow).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
