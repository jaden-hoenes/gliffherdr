# cargo-deny configuration: licences, advisories, bans, sources.
# Run: scripts/deny.sh   (CI: EmbarkStudios/cargo-deny-action)

[graph]
# The release binaries are Linux; checking more targets would only add licences we never ship.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
# A known vulnerability, an unsound crate or a yanked version fails the check.
yanked = "deny"
ignore = []

[licenses]
# Permissive, OSI-approved licences only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
